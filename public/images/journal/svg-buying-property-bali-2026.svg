  <!-- Canggu 14.8% -->
  <text x="30" y="104" fill="#5C2E1F" font-size="11">Canggu</text>
  <rect x="120" y="92" width="296" height="20" fill="#1E6244" rx="3"/>
  <text x="422" y="106" fill="#1E6244" font-size="12" font-weight="bold"> 14.8%</text>

  <!-- Seminyak 13.1% -->
  <text x="30" y="128" fill="#5C2E1F" font-size="11">Seminyak</text>
  <rect x="120" y="116" width="262" height="20" fill="#2A7A55" rx="3"/>
  <text x="388" y="130" fill="#2A7A55" font-size="12" font-weight="bold"> 13.1%</text>

  <!-- Kedungu 11.2% -->
  <text x="30" y="152" fill="#5C2E1F" font-size="11">Kedungu</text>
  <rect x="120" y="140" width="224" height="20" fill="#C2A973" rx="3"/>
  <text x="350" y="154" fill="#C2A973" font-size="12" font-weight="bold"> 11.2%</text>

  <!-- Market avg 10.6% dashed -->
  <text x="30" y="176" fill="#8B7355" font-size="10">Mkt avg</text>
  <line x1="120" y1="166" x2="332" y2="166" stroke="#8B7355" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="337" y="170" fill="#8B7355" font-size="10" font-weight="bold"> 10.6%</text>

  <!-- Ubud 9.6% -->
  <text x="30" y="200" fill="#5C2E1F" font-size="11">Ubud</text>
  <rect x="120" y="188" width="192" height="20" fill="#8B7355" rx="3" opacity="0.75"/>
  <text x="318" y="202" fill="#8B7355" font-size="12" font-weight="bold"> 9.6%</text>

  <!-- East Bali 7.2% -->
  <text x="30" y="224" fill="#5C2E1F" font-size="11">East Bali</text>
  <rect x="120" y="212" width="144" height="20" fill="#8B7355" rx="3" opacity="0.5"/>
  <text x="270" y="226" fill="#8B7355" font-size="12" font-weight="bold"> 7.2%</text>

  <text x="270" y="246" fill="#8B7355" font-size="9">Source: Ayla Property 2026 dataset · 511 listings · 80 developers · 15 areas</text>

  <!-- Right: Price table -->
  <rect x="510" y="74" width="268" height="174" fill="white" rx="6" stroke="#DCD4C4" stroke-width="1"/>
  <rect x="510" y="74" width="268" height="26" fill="#2A7A55" rx="6"/>
  <rect x="510" y="88" width="268" height="12" fill="#2A7A55"/>
  <text x="644" y="91" text-anchor="middle" fill="white" font-size="12" font-weight="bold">MEDIAN ENTRY PRICE (USD)</text>
  <text x="526" y="116" fill="#8B7355" font-size="11">Seminyak</text>
  <text x="762" y="116" text-anchor="end" fill="#5C2E1F" font-size="12" font-weight="bold">$420,000</text>
  <line x1="526" y1="122" x2="762" y2="122" stroke="#F5EDE0" stroke-width="1"/>
  <text x="526" y="138" fill="#8B7355" font-size="11">Canggu</text>
  <text x="762" y="138" text-anchor="end" fill="#5C2E1F" font-size="12" font-weight="bold">$380,000</text>
  <line x1="526" y1="144" x2="762" y2="144" stroke="#F5EDE0" stroke-width="1"/>
  <text x="526" y="160" fill="#8B7355" font-size="11">Ubud</text>
  <text x="762" y="160" text-anchor="end" fill="#5C2E1F" font-size="12" font-weight="bold">$290,000</text>
  <line x1="526" y1="166" x2="762" y2="166" stroke="#F5EDE0" stroke-width="1"/>
  <text x="526" y="182" fill="#8B7355" font-size="11">Kedungu</text>
  <text x="762" y="182" text-anchor="end" fill="#5C2E1F" font-size="12" font-weight="bold">$245,000</text>
  <line x1="526" y1="188" x2="762" y2="188" stroke="#F5EDE0" stroke-width="1"/>
  <text x="526" y="204" fill="#8B7355" font-size="11">East Bali</text>
  <text x="762" y="204" text-anchor="end" fill="#5C2E1F" font-size="12" font-weight="bold">$165,000</text>
  <line x1="526" y1="210" x2="762" y2="210" stroke="#DCD4C4" stroke-width="1"/>
  <text x="526" y="232" fill="#2A7A55" font-size="11" font-weight="bold">MARKET MEDIAN</text>
  <text x="762" y="232" text-anchor="end" fill="#2A7A55" font-size="14" font-weight="bold">$290,000</text>

  <!-- Buying process -->
  <text x="30" y="276" fill="#5C2E1F" font-size="11" font-weight="bold">6-STEP BUYING PROCESS (TYPICAL: 4–8 WEEKS)</text>

  <rect x="20"  y="284" width="110" height="44" fill="#2A7A55" rx="5"/>
  <text x="75" y="302" text-anchor="middle" fill="white" font-size="9" font-weight="bold">1. BRIEF</text>
  <text x="75" y="318" text-anchor="middle" fill="#DCD4C4" font-size="8">Goals + budget</text>

  <rect x="138" y="284" width="110" height="44" fill="#C2A973" rx="5"/>
  <text x="193" y="302" text-anchor="middle" fill="white" font-size="9" font-weight="bold">2. SELECTION</text>
  <text x="193" y="318" text-anchor="middle" fill="#F5EDE0" font-size="8">Shortlist + inspect</text>

  <rect x="256" y="284" width="110" height="44" fill="#2A7A55" rx="5"/>
  <text x="311" y="300" text-anchor="middle" fill="white" font-size="9" font-weight="bold">3. DUE DILIGENCE</text>
  <text x="311" y="314" text-anchor="middle" fill="#DCD4C4" font-size="8">Title · Zone · PBG · SLF</text>

  <rect x="374" y="284" width="110" height="44" fill="#C2A973" rx="5"/>
  <text x="429" y="302" text-anchor="middle" fill="white" font-size="9" font-weight="bold">4. LEGAL</text>
  <text x="429" y="318" text-anchor="middle" fill="#F5EDE0" font-size="8">Notary + agreement</text>

  <rect x="492" y="284" width="110" height="44" fill="#2A7A55" rx="5"/>
  <text x="547" y="302" text-anchor="middle" fill="white" font-size="9" font-weight="bold">5. PAYMENT</text>
  <text x="547" y="318" text-anchor="middle" fill="#DCD4C4" font-size="8">Deposit + staged</text>

  <rect x="610" y="284" width="164" height="44" fill="#C2A973" rx="5"/>
  <text x="692" y="302" text-anchor="middle" fill="white" font-size="9" font-weight="bold">6. HANDOVER</text>
  <text x="692" y="318" text-anchor="middle" fill="#F5EDE0" font-size="8">Keys + management setup</text>

  <!-- 2026 compliance note -->
  <rect x="20" y="342" width="760" height="42" fill="white" rx="6" stroke="#E85A3A" stroke-width="1.5"/>
  <text x="36" y="360" fill="#E85A3A" font-size="11" font-weight="bold">2026 COMPLIANCE:</text>
  <text x="160" y="360" fill="#5C2E1F" font-size="11">All STR listings now require a valid NIB business number + KBLI 55203 classification.</text>
  <text x="36" y="377" fill="#5C2E1F" font-size="11">Platforms are actively delisting non-compliant properties. Confirm before settlement.</text>

  <text x="400" y="410" text-anchor="middle" fill="#8B7355" font-size="9">Source: Ayla Property 2026 dataset · 511 listings · 80 developers · 15 areas</text>
</svg>
