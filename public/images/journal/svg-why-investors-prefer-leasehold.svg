<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="800" height="430" fill="#F5EDE0" rx="10"/>
  <rect width="800" height="56" fill="#5C2E1F" rx="10"/>
  <rect y="44" width="800" height="12" fill="#5C2E1F"/>
  <text x="400" y="34" text-anchor="middle" fill="white" font-size="16" font-weight="bold" letter-spacing="1">THE FREEHOLD TRAP — SAME VILLA, VERY DIFFERENT ROI</text>

  <!-- Freehold box -->
  <rect x="20" y="68" width="340" height="130" fill="white" rx="8" stroke="#5C2E1F" stroke-width="1.5"/>
  <rect x="20" y="68" width="340" height="26" fill="#5C2E1F" rx="8"/>
  <rect x="20" y="82" width="340" height="12" fill="#5C2E1F"/>
  <text x="190" y="85" text-anchor="middle" fill="white" font-size="13" font-weight="bold">FREEHOLD (Via PT PMA)</text>
  <text x="190" y="114" text-anchor="middle" fill="#8B7355" font-size="11">Entry price</text>
  <text x="190" y="138" text-anchor="middle" fill="#5C2E1F" font-size="26" font-weight="bold">$500,000</text>
  <text x="190" y="158" text-anchor="middle" fill="#8B7355" font-size="11">Annual net income: $40,000</text>
  <text x="190" y="178" text-anchor="middle" fill="#5C2E1F" font-size="11">ROI:</text>
  <text x="240" y="186" text-anchor="middle" fill="#5C2E1F" font-size="28" font-weight="bold">8%</text>

  <!-- VS -->
  <text x="400" y="138" text-anchor="middle" fill="#8B7355" font-size="16" font-weight="bold">SAME VILLA</text>
  <text x="400" y="158" text-anchor="middle" fill="#8B7355" font-size="16" font-weight="bold">SAME</text>
  <text x="400" y="178" text-anchor="middle" fill="#8B7355" font-size="16" font-weight="bold">INCOME</text>

  <!-- Leasehold box -->
  <rect x="440" y="68" width="340" height="130" fill="#EEF7F2" rx="8" stroke="#2A7A55" stroke-width="2.5"/>
  <rect x="440" y="68" width="340" height="26" fill="#2A7A55" rx="8"/>
  <rect x="440" y="82" width="340" height="12" fill="#2A7A55"/>
  <text x="610" y="85" text-anchor="middle" fill="white" font-size="13" font-weight="bold">LEASEHOLD (25–30yr Hak Sewa)</text>
  <text x="610" y="114" text-anchor="middle" fill="#8B7355" font-size="11">Entry price</text>
  <text x="610" y="138" text-anchor="middle" fill="#2A7A55" font-size="26" font-weight="bold">$200,000</text>
  <text x="610" y="158" text-anchor="middle" fill="#8B7355" font-size="11">Annual net income: $40,000</text>
  <text x="610" y="178" text-anchor="middle" fill="#2A7A55" font-size="11">ROI:</text>
  <text x="660" y="188" text-anchor="middle" fill="#2A7A55" font-size="34" font-weight="bold">20%</text>

  <!-- 4 reasons -->
  <text x="30" y="220" fill="#5C2E1F" font-size="11" font-weight="bold">4 REASONS SMART INVESTORS CHOOSE LEASEHOLD</text>

  <rect x="20" y="228" width="182" height="82" fill="white" rx="6" stroke="#2A7A55" stroke-width="1"/>
  <rect x="20" y="228" width="182" height="22" fill="#2A7A55" rx="6"/>
  <rect x="20" y="238" width="182" height="12" fill="#2A7A55"/>
  <text x="111" y="243" text-anchor="middle" fill="white" font-size="10" font-weight="bold">1. LOWER ENTRY, HIGHER YIELD</text>
  <text x="32" y="262" fill="#5C2E1F" font-size="10">Capital recouped in 3–5 years</text>
  <text x="32" y="278" fill="#5C2E1F" font-size="10">vs 8–10 years for freehold.</text>
  <text x="32" y="300" fill="#2A7A55" font-size="10" font-weight="bold">Same villa, same income.</text>

  <rect x="210" y="228" width="182" height="82" fill="white" rx="6" stroke="#2A7A55" stroke-width="1"/>
  <rect x="210" y="228" width="182" height="22" fill="#2A7A55" rx="6"/>
  <rect x="210" y="238" width="182" height="12" fill="#2A7A55"/>
  <text x="301" y="243" text-anchor="middle" fill="white" font-size="10" font-weight="bold">2. MARKET AGILITY</text>
  <text x="222" y="262" fill="#5C2E1F" font-size="10">Hot spots shift fast in Bali.</text>
  <text x="222" y="278" fill="#5C2E1F" font-size="10">Ride the wave, exit, reinvest</text>
  <text x="222" y="294" fill="#5C2E1F" font-size="10">in the next emerging area.</text>
  <text x="222" y="308" fill="#2A7A55" font-size="10" font-weight="bold">Freehold locks you in forever.</text>

  <rect x="400" y="228" width="186" height="82" fill="white" rx="6" stroke="#C2A973" stroke-width="1"/>
  <rect x="400" y="228" width="186" height="22" fill="#C2A973" rx="6"/>
  <rect x="400" y="238" width="186" height="12" fill="#C2A973"/>
  <text x="493" y="243" text-anchor="middle" fill="white" font-size="10" font-weight="bold">3. BALI CLIMATE REALITY</text>
  <text x="412" y="262" fill="#5C2E1F" font-size="10">Tropical sun, humidity, monsoon</text>
  <text x="412" y="278" fill="#5C2E1F" font-size="10">rains = villas need major</text>
  <text x="412" y="294" fill="#5C2E1F" font-size="10">renovation every 15–20 years.</text>
  <text x="412" y="308" fill="#C2A973" font-size="10" font-weight="bold">Why pay freehold premium?</text>

  <rect x="594" y="228" width="186" height="82" fill="white" rx="6" stroke="#C2A973" stroke-width="1"/>
  <rect x="594" y="228" width="186" height="22" fill="#C2A973" rx="6"/>
  <rect x="594" y="238" width="186" height="12" fill="#C2A973"/>
  <text x="687" y="243" text-anchor="middle" fill="white" font-size="10" font-weight="bold">4. FLIP AND ROLL STRATEGY</text>
  <text x="606" y="262" fill="#5C2E1F" font-size="10">Off-plan leasehold → 15–20%</text>
  <text x="606" y="278" fill="#5C2E1F" font-size="10">ROI for 3–5 yrs → sell at</text>
  <text x="606" y="294" fill="#5C2E1F" font-size="10">appreciated value → reinvest.</text>
  <text x="606" y="308" fill="#C2A973" font-size="10" font-weight="bold">Compound gains every cycle.</text>

  <!-- Good lease checklist -->
  <rect x="20" y="322" width="760" height="58" fill="white" rx="6" stroke="#2A7A55" stroke-width="1.5"/>
  <text x="36" y="340" fill="#2A7A55" font-size="11" font-weight="bold">GOOD LEASE CHECKLIST:</text>
  <text x="36" y="358" fill="#5C2E1F" font-size="10">✓ BPN registration</text>
  <text x="160" y="358" fill="#5C2E1F" font-size="10">✓ Renewal clause with locked pricing</text>
  <text x="390" y="358" fill="#5C2E1F" font-size="10">✓ Fixed 25+25 yr term (not rolling)</text>
  <text x="610" y="358" fill="#5C2E1F" font-size="10">✓ Right to sell without approval</text>
  <text x="36" y="374" fill="#5C2E1F" font-size="10">✓ Force majeure and government acquisition clause</text>
  <text x="340" y="374" fill="#2A7A55" font-size="10" font-weight="bold">→ Every Ayla client lease is reviewed against all 5 criteria before recommendation.</text>

  <text x="400" y="420" text-anchor="middle" fill="#8B7355" font-size="9">Source: Ayla Property 2026 · Indonesian property law · Broker analysis of 511 active listings</text>
</svg>
