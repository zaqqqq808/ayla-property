<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="800" height="400" fill="#F5EDE0" rx="12"/>
  <rect width="800" height="60" fill="#2A7A55" rx="12"/>
  <rect y="48" width="800" height="12" fill="#2A7A55"/>
  <text x="400" y="36" text-anchor="middle" fill="white" font-size="16" font-weight="bold" letter-spacing="1">IS BALI PROPERTY A GOOD INVESTMENT? GLOBAL YIELD COMPARISON (2026)</text>

  <text x="40" y="84" fill="#5C2E1F" font-size="11" font-weight="bold" letter-spacing="1">AVERAGE GROSS RENTAL YIELD BY MARKET — SAME CAPITAL, VERY DIFFERENT RETURNS</text>

  <!-- Bali Canggu — top bar -->
  <rect x="40" y="92" width="534" height="34" fill="#1E6244" rx="4"/>
  <text x="56" y="114" fill="white" font-size="13" font-weight="bold">Bali — Canggu (top performing)</text>
  <text x="582" y="114" fill="#1E6244" font-size="18" font-weight="bold">14.8%</text>

  <!-- Bali Market Average -->
  <rect x="40" y="134" width="381" height="34" fill="#2A7A55" rx="4"/>
  <text x="56" y="156" fill="white" font-size="13" font-weight="bold">Bali — Market Average (511 listings)</text>
  <text x="429" y="156" fill="#2A7A55" font-size="18" font-weight="bold">10.6%</text>

  <!-- Dubai -->
  <rect x="40" y="176" width="234" height="34" fill="#C2A973" rx="4"/>
  <text x="56" y="198" fill="white" font-size="13" font-weight="bold">Dubai (residential)</text>
  <text x="282" y="198" fill="#C2A973" font-size="18" font-weight="bold">6.5%</text>

  <!-- Gold Coast -->
  <rect x="40" y="218" width="177" height="34" fill="#8B7355" rx="4"/>
  <text x="56" y="240" fill="white" font-size="13" font-weight="bold">Gold Coast</text>
  <text x="225" y="240" fill="#8B7355" font-size="18" font-weight="bold">4.8%</text>

  <!-- Melbourne -->
  <rect x="40" y="260" width="128" height="34" fill="#8B7355" rx="4" opacity="0.8"/>
  <text x="56" y="282" fill="white" font-size="12">Melbourne</text>
  <text x="176" y="282" fill="#8B7355" font-size="18" font-weight="bold">3.4%</text>

  <!-- Sydney -->
  <rect x="40" y="302" width="121" height="34" fill="#8B7355" rx="4" opacity="0.6"/>
  <text x="56" y="324" fill="white" font-size="12">Sydney</text>
  <text x="169" y="324" fill="#8B7355" font-size="18" font-weight="bold">3.2%</text>

  <!-- Singapore -->
  <rect x="40" y="344" width="107" height="34" fill="#8B7355" rx="4" opacity="0.4"/>
  <text x="56" y="366" fill="#5C2E1F" font-size="12">Singapore</text>
  <text x="155" y="366" fill="#8B7355" font-size="18" font-weight="bold">2.8%</text>

  <!-- Right panel: net yield caveat + data note -->
  <rect x="580" y="74" width="195" height="290" fill="white" rx="8" stroke="#DCD4C4"/>
  <text x="677" y="94" text-anchor="middle" fill="#5C2E1F" font-size="10" font-weight="bold">DATASET: 511 LISTINGS</text>
  <line x1="596" y1="100" x2="760" y2="100" stroke="#DCD4C4" stroke-width="1"/>
  <text x="596" y="118" fill="#8B7355" font-size="9">Developers covered: 80+</text>
  <text x="596" y="134" fill="#8B7355" font-size="9">Areas tracked: 15</text>
  <text x="596" y="150" fill="#8B7355" font-size="9">Median entry: $290,000</text>
  <text x="596" y="166" fill="#8B7355" font-size="9">Top yield: 14.8% (Canggu)</text>
  <text x="596" y="182" fill="#8B7355" font-size="9">Lowest yield: 7.2% (E. Bali)</text>
  <line x1="596" y1="194" x2="760" y2="194" stroke="#DCD4C4" stroke-width="1"/>
  <text x="677" y="210" text-anchor="middle" fill="#5C2E1F" font-size="10" font-weight="bold">NET vs GROSS NOTE</text>
  <text x="596" y="228" fill="#8B7355" font-size="9">Gross yields shown above.</text>
  <text x="596" y="244" fill="#8B7355" font-size="9">Net = ~20–30% below</text>
  <text x="596" y="260" fill="#8B7355" font-size="9">after management (15–25%</text>
  <text x="596" y="276" fill="#8B7355" font-size="9">of revenue) + maintenance</text>
  <text x="596" y="292" fill="#8B7355" font-size="9">+ tax (10% withholding).</text>
  <line x1="596" y1="304" x2="760" y2="304" stroke="#DCD4C4" stroke-width="1"/>
  <text x="677" y="322" text-anchor="middle" fill="#2A7A55" font-size="11" font-weight="bold">14.8% gross</text>
  <text x="677" y="338" text-anchor="middle" fill="#2A7A55" font-size="11" font-weight="bold">≈ 10–12% net</text>
  <text x="677" y="354" text-anchor="middle" fill="#8B7355" font-size="9">Still exceptional globally</text>

  <text x="400" y="392" text-anchor="middle" fill="#8B7355" font-size="9">Source: Ayla Property 2026 dataset · Global Property Guide · Australian Bureau of Statistics · Property Finder Dubai</text>
</svg>
